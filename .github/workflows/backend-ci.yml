name: Backend CI

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetings_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/meetings_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/meetings_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: System packages (ffmpeg, Pango, Arabic fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-noto-core libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q
