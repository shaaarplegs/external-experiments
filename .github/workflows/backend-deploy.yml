name: Deploy backend to Cloud Run

# Runs only after the one-time setup in backend/README.md ("Automatic deploys from GitHub"):
# it needs the repository variables GCP_PROJECT_ID, GCP_REGION,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT and ADMIN_EMAIL.
# No keys are stored in GitHub: secrets come from Secret Manager.

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: meetings-api
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/meetings/$SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "meetings-api@$PROJECT.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --no-cpu-throttling --cpu 1 --memory 1Gi \
            --concurrency 10 --min-instances 0 --max-instances 3 --timeout 900 \
            --set-env-vars "ENVIRONMENT=production,ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" \
            --set-secrets "DATABASE_URL=meetings-database-url:latest,SECRET_KEY=meetings-secret-key:latest,ADMIN_PASSWORD=meetings-admin-password:latest"
