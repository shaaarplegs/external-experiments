# Local development: the same PostgreSQL the app uses in production (Neon), plus the API.
#   docker compose up -d db        # just the database (run the API with uvicorn yourself)
#   docker compose up --build      # database + API on http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetings
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/meetings
      SECRET_KEY: local-dev-secret-local-dev-secret-local
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: local-admin-password
      PORT: "8000"
    ports: ["8000:8000"]

volumes:
  pgdata:
